name: Check site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js favicon.svg 404.html; do
            test -s "$f"
            echo "ok $f"
          done
          grep -q "港股模擬盤" index.html
          grep -q "0434" app.js
          grep -q "3988" app.js
          node --check app.js
          echo "checks passed"
