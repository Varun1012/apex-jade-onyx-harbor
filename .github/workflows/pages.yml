name: Check site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js favicon.svg 404.html audio/market-ticker.mp3; do
            test -s "$f"
            echo "ok $f"
          done
          grep -q "港股模擬盤" index.html
          grep -q "0434" app.js
          grep -q "3988" app.js
          grep -q "0027" app.js
          grep -q "0293" app.js
          grep -q "2269" app.js
          grep -q "2899" app.js
          grep -q "0020" app.js
          grep -q "0981" app.js
          grep -q "1888" app.js
          grep -q "2513" app.js
          grep -q "market-ticker.mp3" app.js
          grep -q "rollExtreme" app.js
          grep -q "暴升" app.js
          grep -q "0.105" app.js
          grep -q "data-pos-pnl" app.js
          grep -q "paintPositions" app.js
          grep -q "mergeQuotes" app.js
          grep -q "compactCandles" app.js
          grep -q "expandCandles" app.js
          grep -q "adoptForming" app.js
          grep -q "repairQuotesFromCandles" app.js
          grep -q "開市競價" app.js
          grep -q "冷靜期" app.js
          grep -q "applyBtcOvernight" app.js
          grep -q "美股盤中" app.js
          grep -q "data-div" app.js
          grep -q "派息日" app.js
          grep -q "停牌" app.js
          grep -q "data-ohlc" app.js
          node --check app.js
          echo "checks passed"
